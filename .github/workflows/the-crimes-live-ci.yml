name: The Crimes Live CI

on:
  push:
    paths:
      - 'server/**'
      - 'live/**'
      - '.github/workflows/the-crimes-live-ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'live/**'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package.json
      - run: npm install
      - run: node --check index.js
