<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0e">
<title>THE CRIMES LIVE</title>
<style>
:root{--bg:#07090d;--panel:#0e131b;--panel2:#141a23;--line:#343c48;--gold:#f1b750;--gold2:#ffd88d;--red:#e6413b;--green:#45d17a;--yellow:#e9c14e;--orange:#ef8a39;--muted:#9da5af;--white:#f5f4ef;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--white);font-family:Inter,'Segoe UI',Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.hidden,[hidden]{display:none!important}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(#05080cbf,#05080cf0),url('../assets/the-crimes/city-banner.webp') center/cover no-repeat}
.shell{min-height:100dvh;max-width:1920px;margin:auto}.top{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px clamp(14px,2vw,34px);border-bottom:1px solid #473c2f;background:#090d12e8}
.brand{font-weight:950;font-size:clamp(24px,2.2vw,42px);font-style:italic;letter-spacing:-.04em}.brand em{color:var(--red);font-style:inherit}.brand small{display:block;font-size:8px;letter-spacing:.24em;text-align:center}.server{font-size:11px;color:var(--green);font-weight:800}.container{padding:18px clamp(14px,2vw,34px) 28px}
.card{border:1px solid var(--line);border-radius:12px;background:#0c1118ed;box-shadow:0 20px 60px #0005}.head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.head h1,.head h2,.head h3{margin:0}
.kicker{font-size:10px;font-weight:900;letter-spacing:.1em;color:var(--gold);text-transform:uppercase}.muted{color:var(--muted)}.btn{border:1px solid #4a5462;border-radius:8px;background:#111821;color:#eef1f4;padding:10px 14px;font-weight:800}.btn.gold{border-color:#d69a3c;background:linear-gradient(#f5c96f,#c9852a);color:#1d1205}.btn.red{border-color:#a23835;color:#ffc4c1;background:#241112}.btn.green{border-color:#367a51;color:#bdf1cf;background:#0d1e15}.btn:disabled{opacity:.4}
.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase}.field input,.field select{width:100%;border:1px solid #3b4654;border-radius:8px;background:#0a1017;color:#fff;padding:11px 12px}.grid{display:grid;gap:12px}.grid3{grid-template-columns:repeat(3,1fr)}
.setup{max-width:1100px;margin:18px auto}.inside{padding:18px}.cases{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.case{display:grid;grid-template-columns:78px 1fr;overflow:hidden;border:1px solid #3b4450;border-radius:9px;background:#0f151d;color:#fff;text-align:left;padding:0}.case img{width:78px;height:74px;object-fit:cover}.case span{padding:11px}.case small{display:block;color:var(--red);font-weight:900}.case strong{display:block;margin-top:4px}.case.active{border-color:var(--gold);box-shadow:0 0 0 1px #f1b75044}
.admin{display:grid;grid-template-columns:320px 1fr;gap:14px}.host{padding:16px}.code{font-size:34px;font-weight:950;letter-spacing:.05em;margin:8px 0}.waiting{padding:10px;border:1px solid #6b552f;border-radius:8px;color:var(--gold2);font-weight:900;font-size:12px;margin:10px 0}.qr{display:block;width:min(240px,100%);margin:12px auto;border:8px solid #fff;border-radius:8px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px}.controls .wide{grid-column:1/-1}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}.metric{padding:12px;border:1px solid #343d48;border-radius:9px;background:#0e141c}.metric small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase}.metric strong{font-size:20px}
.tablewrap{overflow:auto;max-height:56vh}.players{width:100%;border-collapse:collapse;font-size:12px}.players th{position:sticky;top:0;background:#111821;color:#aeb5be;text-align:left;padding:9px;border-bottom:1px solid #3d4651;font-size:9px;text-transform:uppercase}.players td{padding:8px 9px;border-bottom:1px solid #262e38}
.playerShell{max-width:620px;margin:auto;min-height:100dvh;background:#070a0fdd;border-left:1px solid #242c35;border-right:1px solid #242c35}.playerTop{padding:max(14px,env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid #323b46;display:flex;justify-content:space-between}.view{padding:18px 16px max(22px,env(safe-area-inset-bottom))}.joinCard{padding:18px}.joinCard .btn{width:100%;margin-top:12px;min-height:54px}.center{text-align:center;padding-top:8vh}.art{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;border:1px solid #6b5130}.spinner{width:36px;height:36px;border:4px solid #303845;border-top-color:var(--gold);border-radius:50%;margin:18px auto;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.scene{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1px solid #594a37}.scene img{width:100%;height:100%;object-fit:cover}.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,#070a0fd9)}.sceneMeta{position:absolute;left:12px;bottom:10px;z-index:2}.sceneMeta small{display:block;color:var(--gold);font-weight:900}.qhead{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px}.timer{font-size:24px;font-weight:950}.qtext{font-size:22px;line-height:1.22;margin:8px 0 14px}.answers{display:flex;flex-direction:column;gap:9px}.answer{display:grid;grid-template-columns:42px 1fr;gap:9px;align-items:center;width:100%;min-height:58px;border:1px solid #3d4754;border-radius:10px;background:#111821;color:#f4f5f6;text-align:left;padding:8px}.answer.sel{border-color:var(--gold);background:#20170e}.letter{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border:1px solid #a87830;border-radius:7px;color:var(--gold2);font-size:18px;font-weight:950}.ansStatus{margin-top:12px;padding:12px;border-radius:8px;background:#111821;border-left:4px solid #4b5664;font-size:12px}.finalScore{text-align:center;font-size:44px;font-weight:950;color:var(--gold2)}.finalResult{padding:14px;border:1px solid #5c4c35;border-radius:10px;margin:14px 0;text-align:center}
.screen{height:100dvh;overflow:hidden;display:grid;grid-template-rows:72px 1fr 58px}.screenMain{display:grid;grid-template-columns:1.35fr .65fr;gap:14px;padding:14px 20px;min-height:0}.stage{position:relative;overflow:hidden;border:1px solid #604a2d;border-radius:12px;background:#080b0f}.stage>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.48}.stage:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#090c12ed 0,#090c12a8 58%,#090c1228 100%)}.stageCopy{position:relative;z-index:2;height:100%;padding:26px;display:flex;flex-direction:column;justify-content:center;max-width:900px}.stageCopy h1{font-size:clamp(32px,4vw,68px);margin:6px 0 14px;line-height:1.02}.screenSide{min-height:0;overflow:auto}.rank{display:grid;grid-template-columns:32px 1fr 65px 90px;gap:7px;padding:9px 10px;border-bottom:1px solid #28313b;font-size:12px}.footer{display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-top:1px solid #443928;background:#090d12}.footer strong{color:var(--gold2)}
@media(max-width:900px){.admin{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(3,1fr)}.cases{grid-template-columns:1fr 1fr}.screenMain{grid-template-columns:1fr}.screenSide{display:none}}
@media(max-width:560px){.top{min-height:58px;padding:9px 14px}.brand{font-size:24px}.container{padding:12px}.grid3{grid-template-columns:1fr}.cases{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.controls{grid-template-columns:1fr}.controls .wide{grid-column:auto}.qtext{font-size:20px}.scene{max-height:32vh}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
var qs=new URLSearchParams(location.search),view=qs.get('view')||'host',room=(qs.get('room')||'').toUpperCase(),server=qs.get('server')||localStorage.getItem('the-crimes-live-server')||'';
var socket=null,state=null,selectedCase=qs.get('case')||'credores',timer=null;
var cases=[['credores','Fraude contra credores'],['meacao','Ocultação de meação'],['herdeiros','Prejuízo a herdeiros'],['itbi','Operação de ITBI'],['alugueis','Receitas de aluguéis'],['grupos','Grupo societário']];
function e(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(Number(v||0))}
function status(s){return {waiting:'AGUARDANDO INICIAR A PARTIDA...',running:'PARTIDA EM ANDAMENTO',paused:'PARTIDA PAUSADA',finished:'PARTIDA ENCERRADA'}[s]||s||'—'}
function base(){return '<div class="shell"><header class="top"><div class="brand">THE <em>CRIMES</em> LIVE<small>TRIVIAL JURÍDICO MULTIPLAYER</small></div><div id="serverState" class="server">● desconectado</div></header><main id="main" class="container"></main></div>'}
async function connect(url){server=String(url||server||'');if(server.endsWith('/'))server=server.slice(0,-1);if(!server)throw Error('Informe o endereço HTTPS do servidor.');localStorage.setItem('the-crimes-live-server',server);if(!window.io)await new Promise(function(ok,no){var s=document.createElement('script');s.src=server+'/socket.io/socket.io.js';s.onload=ok;s.onerror=function(){no(Error('Falha ao carregar Socket.IO'))};document.head.appendChild(s)});socket=window.io(server,{transports:['websocket','polling']});await new Promise(function(ok,no){var t=setTimeout(function(){no(Error('Servidor não respondeu'))},12000);socket.once('connect',function(){clearTimeout(t);ok()});socket.once('connect_error',function(x){clearTimeout(t);no(x)})});return socket}
function emit(ev,p){return new Promise(function(ok){socket.emit(ev,p,ok)})}
function scenePath(k,r){var n=['contexto','estrutura','operacao','efeito','conflito','apuracao','consequencias','debate'][r-1];return '../assets/the-crimes/scenes/'+k+'/'+String(r).padStart(2,'0')+'_'+n+'.webp'}
document.getElementById('app').innerHTML=base();
if(view==='player')player();else if(view==='screen')screenView();else host();

function host(){
var m=document.getElementById('main');m.innerHTML='<section id="setup" class="card setup"><div class="head"><div><span class="kicker">Criar partida</span><h2>Escolha o crime da aula</h2></div></div><div class="inside"><div class="field"><label>Servidor HTTPS / WebSocket</label><input id="srv" placeholder="https://live.seudominio.com.br" value="'+e(server)+'"></div><div id="caseGrid" class="cases"></div><div class="grid grid3"><div class="field"><label>Máximo de players</label><input id="maxp" type="number" value="30"></div><div class="field"><label>Tempo por pergunta</label><input id="secs" type="number" value="60"></div><div class="field"><label>Modo</label><select id="mode"><option>manual</option><option>automatic</option></select></div></div><div style="text-align:right;margin-top:14px"><button id="create" class="btn gold">CRIAR SALA AO VIVO</button></div><p id="err" class="muted"></p></div></section><section id="dash" class="admin hidden"><aside class="card"><div class="host"><span class="kicker">Sala ativa</span><div id="code" class="code"></div><div id="rstatus" class="waiting"></div><img id="qr" class="qr"><div id="joinurl" class="muted" style="font-size:10px;word-break:break-all"></div><div class="controls"><button id="screenBtn" class="btn wide">ABRIR TELÃO</button><button id="start" class="btn gold wide">▶ INICIAR PARTIDA</button><button id="pause" class="btn">PAUSAR</button><button id="resume" class="btn">CONTINUAR</button><button id="lock" class="btn">BLOQUEAR</button><button id="reveal" class="btn green">REVELAR</button><button id="next" class="btn gold wide">PRÓXIMA RODADA →</button><button id="finish" class="btn red wide">ENCERRAR PARTIDA</button></div></div></aside><div><div id="metrics" class="metrics"></div><section class="card"><div class="head"><div><span class="kicker">Monitor em tempo real</span><h3>Players</h3></div><strong id="pc"></strong></div><div class="tablewrap"><table class="players"><thead><tr><th>Player</th><th>Status</th><th>Etapa</th><th>Pontos</th><th>Ocultou bens?</th><th>Descoberto?</th><th>Exposição</th><th>Decisões</th></tr></thead><tbody id="pb"></tbody></table></div></section></div></section>';
renderCases();
document.getElementById('create').onclick=async function(){try{await connect(document.getElementById('srv').value);document.getElementById('serverState').textContent='● servidor online';var r=await emit('admin:createRoom',{caseKey:selectedCase,maxPlayers:+document.getElementById('maxp').value,questionTimeSec:+document.getElementById('secs').value,mode:document.getElementById('mode').value});if(!r.ok)throw Error(r.error);state=r.room;localStorage.setItem('the-crimes-live-admin',JSON.stringify({code:state.code,adminToken:state.adminToken,server:server}));document.getElementById('setup').classList.add('hidden');document.getElementById('dash').classList.remove('hidden');socket.on('admin:update',function(x){state=x;renderAdmin()});renderAdmin()}catch(x){document.getElementById('err').textContent=x.message}};
function renderCases(){var g=document.getElementById('caseGrid');g.innerHTML='';cases.forEach(function(c,i){var b=document.createElement('button');b.className='case'+(selectedCase===c[0]?' active':'');b.innerHTML='<img src="../assets/the-crimes/portraits/'+c[0]+'.webp"><span><small>CASO '+String(i+1).padStart(2,'0')+'</small><strong>'+e(c[1])+'</strong></span>';b.onclick=function(){selectedCase=c[0];renderCases()};g.appendChild(b)})}
function cmd(id,ev){document.getElementById(id).onclick=async function(){var r=await emit(ev,{code:state.code,adminToken:state.adminToken});if(!r.ok)alert(r.error)}}
['start','pause','resume','lock','reveal','next','finish'].forEach(function(id){cmd(id,{'start':'admin:start','pause':'admin:pause','resume':'admin:resume','lock':'admin:lock','reveal':'admin:reveal','next':'admin:next','finish':'admin:finish'}[id])});
document.getElementById('screenBtn').onclick=function(){var u=new URL(location.href);u.searchParams.set('view','screen');u.searchParams.set('room',state.code);u.searchParams.set('server',server);window.open(u,'the-crimes-screen')};
function renderAdmin(){var s=state.stats||{};document.getElementById('code').textContent=state.code;document.getElementById('rstatus').textContent=status(state.status);document.getElementById('qr').src=state.qrDataUrl;document.getElementById('joinurl').textContent=state.joinUrl;document.getElementById('pc').textContent=(state.playersConnected||0)+' conectados';document.getElementById('metrics').innerHTML=[['Players',s.total||0],['Respondidos',(s.responded||0)+'/'+(s.total||0)],['Exposição média',(s.averageExposure||0)+'/100'],['Ocultou bens',s.ocultouBens||0],['Descobertas',s.ocultacaoDescoberta||0]].map(function(x){return '<div class="metric"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>'}).join('');document.getElementById('pb').innerHTML=(state.players||[]).sort(function(a,b){return b.score-a.score}).map(function(p){return '<tr><td><strong>'+e(p.nickname)+'</strong></td><td>'+(p.connected?'🟢 online':'⚪ offline')+'</td><td>'+p.currentRound+'/8</td><td><strong>'+p.score+'</strong></td><td>'+(p.ocultouBens?'🔴 SIM':'🟢 NÃO')+'</td><td>'+(p.ocultacaoDescoberta?'🔎 SIM':'—')+'</td><td>'+p.exposure+'/100</td><td>🟢 '+(p.counters.correct||0)+' · 🔴 '+(p.counters.criminal||0)+' · 🟡 '+(p.counters.gray||0)+' · 🟠 '+(p.counters.risky||0)+'</td></tr>'}).join('')}
}

async function player(){
document.getElementById('app').innerHTML='<div class="playerShell"><header class="playerTop"><div class="brand" style="font-size:22px">THE <em>CRIMES</em> LIVE</div><span id="conn" class="server">● conectando</span></header><main id="pmain"></main></div>';var p=document.getElementById('pmain'),key='tc-player-'+room,sess=JSON.parse(localStorage.getItem(key)||'null');
try{await connect(server);document.getElementById('conn').textContent='● conectado';socket.on('player:update',function(x){state=x;renderPlayer()});socket.on('player:kicked',function(x){alert(x.message);location.reload()})}catch(x){p.innerHTML='<div class="view"><div class="card joinCard"><h2>Servidor indisponível</h2><p>'+e(x.message)+'</p></div></div>';return}
async function join(nick){var r=await emit('player:join',{code:room,nickname:nick,sessionToken:sess&&sess.sessionToken});if(!r.ok){showJoin(r.error);return}sess={sessionToken:r.player.sessionToken,nickname:r.player.nickname};localStorage.setItem(key,JSON.stringify(sess));state=r.room;renderPlayer()}
if(sess&&sess.sessionToken){var r=await emit('player:join',{code:room,nickname:sess.nickname,sessionToken:sess.sessionToken});if(r.ok){state=r.room;renderPlayer()}else{localStorage.removeItem(key);sess=null;showJoin()}}else showJoin();
function showJoin(err){p.innerHTML='<section class="view"><div class="card joinCard"><span class="kicker">Entrar na partida</span><h1>Sala '+e(room)+'</h1><div class="field"><label>Seu apelido</label><input id="nick" maxlength="24"></div><button id="join" class="btn gold">ENTRAR</button><p class="muted">'+e(err||'')+'</p></div></section>';document.getElementById('join').onclick=function(){join(document.getElementById('nick').value.trim())}}
function renderPlayer(){if(state.status==='waiting'){p.innerHTML='<section class="view center"><img class="art" src="../assets/the-crimes/city-banner.webp"><span class="kicker">'+e(state.caseTitle)+'</span><h1 style="color:var(--gold2)">AGUARDANDO INICIAR A PARTIDA...</h1><div class="spinner"></div><p>🟢 Conectado ao servidor</p><p class="muted">'+(state.playersConnected||0)+' jogadores conectados</p></section>';return}if(state.status==='finished'){var pl=state.player,r=state.finalResult||pl.finalResult||{};p.innerHTML='<section class="view"><span class="kicker">Resultado do aluno</span><h1 style="text-align:center">'+e(pl.nickname)+'</h1><div class="finalScore">'+pl.score+' pts</div><div class="finalResult"><strong>'+e(r.resultLabel||'Resultado final')+'</strong><p>🔴 OCULTOU BENS: <b>'+(pl.ocultouBens?'SIM':'NÃO')+'</b></p><p>🔎 OCULTAÇÃO DESCOBERTA: <b>'+(pl.ocultacaoDescoberta?'SIM':'NÃO')+'</b></p><p>💰 PATRIMÔNIO BLOQUEADO: <b>'+money(pl.patrimonioBloqueado)+'</b></p></div><div class="metrics"><div class="metric"><small>🟢 Corretas</small><strong>'+pl.counters.correct+'</strong></div><div class="metric"><small>🔴 Criminosas</small><strong>'+pl.counters.criminal+'</strong></div><div class="metric"><small>🟡 Zona cinzenta</small><strong>'+pl.counters.gray+'</strong></div><div class="metric"><small>🟠 Alto risco</small><strong>'+pl.counters.risky+'</strong></div></div></section>';return}var q=state.question,pl=state.player;if(!q)return;var old=(pl.answers||[]).find(function(a){return a.questionId===q.id});p.innerHTML='<section class="view"><div class="scene"><img src="'+scenePath(state.caseKey,q.round)+'"><div class="sceneMeta"><small>'+e(q.caseTitle).toUpperCase()+'</small><strong>RODADA '+String(q.round).padStart(2,'0')+' DE 08</strong></div></div><div class="qhead"><span class="kicker">QUESTÃO '+q.round+'/8</span><strong id="tm" class="timer">00:--</strong></div><h1 class="qtext">'+e(q.text)+'</h1><div id="ans" class="answers"></div><div id="ast" class="ansStatus hidden"></div><div class="metrics" style="grid-template-columns:repeat(3,1fr);margin-top:12px"><div class="metric"><small>Pontos</small><strong>'+pl.score+'</strong></div><div class="metric"><small>Exposição</small><strong>'+pl.exposure+'/100</strong></div><div class="metric"><small>Ocultou bens</small><strong>'+(pl.ocultouBens?'🔴 SIM':'🟢 NÃO')+'</strong></div></div></section>';var a=document.getElementById('ans');q.options.forEach(function(o){var b=document.createElement('button');b.className='answer'+(old&&old.optionIndex===o.index?' sel':'');b.disabled=!!old||state.locked||state.status!=='running';b.innerHTML='<span class="letter">'+String.fromCharCode(65+o.index)+'</span><span>'+e(o.text)+'</span>';b.onclick=async function(){var r=await emit('player:answer',{code:room,sessionToken:sess.sessionToken,questionId:q.id,optionIndex:o.index});if(!r.ok)alert(r.error);else{state.player=r.player;renderPlayer()}};a.appendChild(b)});if(old){var meta={correct:'🟢 JURIDICAMENTE ADEQUADA',criminal:'🔴 ATITUDE CRIMINOSA NO CENÁRIO',gray:'🟡 ZONA CINZENTA',risky:'🟠 ALTO RISCO JURÍDICO'}[old.classification]||'RESPOSTA SALVA';var z=document.getElementById('ast');z.classList.remove('hidden');z.textContent=meta+' · Resposta salva. '+(state.revealed&&q.correctIndex!==undefined?'Resposta esperada: '+String.fromCharCode(65+q.correctIndex)+'.':'AGUARDANDO O PROFESSOR REVELAR...')}clearInterval(timer);timer=setInterval(function(){var t=document.getElementById('tm');if(!t)return;var left=Math.max(0,(state.questionTimeSec||60)-Math.floor((Date.now()-(state.roundStartedAt||Date.now()))/1000));t.textContent='00:'+String(left).padStart(2,'0')},500)}
}

async function screenView(){
document.getElementById('app').innerHTML='<div class="screen"><header class="top"><div class="brand">THE <em>CRIMES</em> LIVE<small>TELÃO DA PARTIDA</small></div><div id="serverState" class="server">● conectando</div></header><main class="screenMain"><section class="stage"><img id="sbg" src="../assets/the-crimes/city-banner.webp"><div id="scopy" class="stageCopy"></div></section><aside class="screenSide card"><div class="head"><h3>Ranking</h3><strong id="online"></strong></div><div id="rank"></div></aside></main><footer class="footer"><strong id="froom"></strong><span id="fcase"></span><span>WEBSOCKET · TEMPO REAL</span></footer></div>';try{await connect(server);document.getElementById('serverState').textContent='● servidor online';var r=await emit('screen:join',{code:room});if(!r.ok)throw Error(r.error);state=r.room;socket.on('room:update',function(x){state=x;renderScreen()});renderScreen()}catch(x){document.getElementById('serverState').textContent=x.message}}
