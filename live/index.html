<style>

.rank.top1{background:linear-gradient(90deg,#33240dcc,#151a22);border-left:3px solid #f1c75a}

.screenNext{display:none;align-items:center;gap:10px;margin-left:auto;margin-right:18px}
.screenNext.visible{display:flex}
.screenNextHint{font-size:10px;color:#9da5af;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.screenNextBtn{min-width:230px;border:1px solid #e0a447;border-radius:8px;padding:10px 18px;background:linear-gradient(#f6ca72,#c9872c);color:#1d1205;font-weight:950;letter-spacing:.04em;box-shadow:0 8px 24px #0007}.screenRevealBtn{min-width:210px;border:1px solid #d8a74e;border-radius:8px;padding:10px 16px;background:linear-gradient(180deg,#3b2510,#1c1309);color:#ffd98f;font-weight:950;letter-spacing:.035em;box-shadow:0 8px 22px #0007}.screenRevealBtn:hover{filter:brightness(1.12)}.screenRevealBtn:disabled{opacity:.45}.playerNotice{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:9999;max-width:calc(100vw - 28px);padding:10px 14px;border:1px solid #d8a74e;border-radius:10px;background:#0b1018ee;color:#ffe3a9;font-weight:900;box-shadow:0 12px 34px #0009;transition:.18s ease}.playerNotice.show{opacity:1;transform:translate(-50%,0)}
.screenNextBtn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.35)}
.screenNextBtn.ready{animation:screenNextPulse 1.8s ease-in-out infinite}
@keyframes screenNextPulse{0%,100%{box-shadow:0 8px 24px #0007,0 0 0 0 #f1b75000}50%{box-shadow:0 8px 24px #0007,0 0 0 5px #f1b75035}}
