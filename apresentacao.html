<script>const SCENES=[{"title":"Capa e conceito","src":"assets/telas/01_CAPA_E_CONCEITO.webp"},{"title":"Patrimônio e receitas","src":"assets/telas/02_ENTRADA_PATRIMONIO_E_RECEITAS.webp"},{"title":"Tributação da pessoa física","src":"assets/telas/03_CALCULO_PESSOA_FISICA_IRPF.webp"},{"title":"Tributação da holding","src":"assets/telas/04_CALCULO_HOLDING_LUCRO_PRESUMIDO.webp"},{"title":"Custos de implantação e ITBI","src":"assets/telas/05_CUSTOS_E_ITBI.webp"},{"title":"Economia tributária comparada","src":"assets/telas/06_COMPARACAO_TRIBUTARIA_E_ECONOMIA.webp"},{"title":"VPL e cenários","src":"assets/telas/07_VPL_PROJECAO_E_CENARIOS.webp"},{"title":"Conclusão e aprendizado","src":"assets/telas/08_CONCLUSAO_E_APRENDIZADO.webp"}];let current=0;function render(){let s=SCENES[current];document.getElementById('slide').src=s.src;document.getElementById('slide').alt=s.title;document.getElementById('counter').textContent=String(current+1).padStart(2,'0')+' / 08 — '+s.title;}
function move(n){current=(current+n+SCENES.length)%SCENES.length;render()}document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen?.();document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);if(e.key==='Escape'&&document.fullscreenElement)document.exitFullscreen()});render();</script></body></html>
