name: The Crimes Live CI

on:
  push:
    paths:
      - 'server/**'
      - 'live/**'
      - 'react-app/**'
      - 'react-live/**'
      - 'legacy-live/**'
      - 'assets/the-crimes-v5/**'
      - '.github/workflows/the-crimes-live-ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'live/**'
      - 'react-app/**'
      - 'react-live/**'
      - 'legacy-live/**'
      - 'assets/the-crimes-v5/**'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package.json
      - run: npm install
      - run: node --check index.js
      - name: Check live JavaScript syntax
        working-directory: .
        run: |
          node --check legacy-live/app.js
          node --check legacy-live/v3-assets.js
          node --check legacy-live/ux-personas.js
          node tests/live-ux-v38.test.js
          node tests/live-ux-v40.test.js
          node tests/live-ux-v41.test.js
          node tests/live-ux-v42.test.js
          node tests/live-primary-react.test.cjs
          test -s legacy-live/showroom.html
          test -s assets/the-crimes-v3/CREDITS.md
          test -s assets/the-crimes-v3/ui/lady-justice.svg
          grep -q 'ux-v41.css' legacy-live/index.html
          grep -q 'ux-v42.css' legacy-live/index.html
          test -s legacy-live/ux-v42.css
          for n in 01 02 03 04 05 06 07 08; do test -s "assets/the-crimes-v3/scenes/credores-v42/$n-scene.webp"; done
          test -f legacy-live/ux-v38.css
          test -f legacy-live/ux-v39.css
          test -f legacy-live/ux-v40.css
          test -s assets/the-crimes-v3/ui/detective-mark.svg
          grep -q 'ux-v40.css' legacy-live/index.html
          grep -q 'ux-v39.css' legacy-live/index.html
          for persona in detetive advogado delegado estrategista perita advogada investigadora analista especialista auditor arquivista mediador; do
            test -s "assets/the-crimes-v3/avatars/$persona.webp"
          done
          grep -q 'ux-personas.js' legacy-live/index.html
          grep -q 'ux-v38.css' legacy-live/index.html
      - name: Validate V3 production bundle and visual assets
        working-directory: .
        run: |
          grep -q 'app.js?v=20261111-v42-prod-1' legacy-live/index.html
          grep -q 'v3-assets.js?v=20261111-9' legacy-live/index.html
          test -f assets/the-crimes-v3/global/command-center.webp
          test -f assets/the-crimes-v3/global/courtroom.webp
          test -f assets/the-crimes-v3/global/investigation-keyart.webp
          for case_name in credores meacao herdeiros itbi alugueis grupos; do
            test "$(find "assets/the-crimes/scenes/$case_name" -maxdepth 1 -name '*.webp' | wc -l)" -ge 8
          done

  react-build:
    name: React V5 cinematic build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: react-app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck and build React V5
        run: npm run build
      - name: Validate artwork, 12 characters and 48 scenes
        run: node tests/assets.test.cjs
      - name: Verify React V5 cinematic gallery and realtime channels
        run: npm run test:visual
      - name: Verify avatar identity on staging backend (V6 only)
        if: github.ref == 'refs/heads/feature/the-crimes-v6-cinematic'
        run: node tests/v6-avatar.integration.cjs
      - name: Verify React primary route and complete backup
        working-directory: .
        run: node tests/live-primary-react.test.cjs
      - name: Browser QA V6 - Host, Projector, 2 phones and podium
        if: github.ref == 'refs/heads/feature/the-crimes-v6-cinematic'
        run: |
          npm install --no-save playwright-core
          CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_PATH"
          export CHROME_PATH
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          python3 -m http.server 8126 --directory .. > /tmp/the-crimes-http.log 2>&1 &
          sleep 2
          TC_QA_OUTPUT_DIR=/tmp/the-crimes-v6 TC_QA_BASE=http://127.0.0.1:8126/react-live/ node qa-v6.cjs
      - name: Upload V6 visual QA screenshots
        if: always() && github.ref == 'refs/heads/feature/the-crimes-v6-cinematic'
        uses: actions/upload-artifact@v4
        with:
          name: the-crimes-v6-visual-qa
          path: /tmp/the-crimes-v6/
          if-no-files-found: ignore
          retention-days: 7

